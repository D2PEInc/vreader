name: Build Sideload IPA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sideload-ipa.yml"
      - ".github/ci/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Patch MainActor default-arg call sites (sideload CI only)
        run: python3 .github/ci/apply_mainactor_patches.py

      - name: Soften Swift concurrency in project.yml for CI only
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("project.yml")
          t = p.read_text()
          t2 = t.replace('SWIFT_VERSION: "6.0"', 'SWIFT_VERSION: "5.0"')
          t2 = t2.replace("SWIFT_STRICT_CONCURRENCY: complete", "SWIFT_STRICT_CONCURRENCY: minimal")
          if t2 == t:
              raise SystemExit("project.yml concurrency/version markers not found")
          p.write_text(t2)
          print("patched project.yml")
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project vreader.xcodeproj \
            -scheme vreader

      - name: Archive (unsigned, for sideload resign)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive \
            -project vreader.xcodeproj \
            -scheme vreader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/vreader.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -swift-version 5'
          test -d build/vreader.xcarchive/Products/Applications

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/vreader.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          echo "Packaging: $APP"
          rm -rf Payload build/ipa
          mkdir -p Payload build/ipa
          cp -R "$APP" Payload/
          zip -qry build/ipa/vreader-sideload.ipa Payload
          ls -lh build/ipa/vreader-sideload.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vreader-sideload-ipa
          path: build/ipa/vreader-sideload.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ipa-sideload-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" build/ipa/vreader-sideload.ipa \
            --title "vreader sideload IPA ($TAG)" \
            --notes "Unsigned IPA for sideloading (AltStore / Sideloadly / similar). Resign on install." \
            --latest
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
